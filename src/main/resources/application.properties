spring.application.name=seatreserv

# =========================================================
# Server
# =========================================================
server.port=8080

# =========================================================
# Database
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seatdb?useAffectedRows=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shivam@1428}

# =========================================================
# HikariCP
# =========================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=SeatReservHikariPool

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.isolation=2
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Don't use create/update in a production-like assignment
spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false

# =========================================================
# Application
# =========================================================
app.user.maxseatlimit=${MAX_USER_SEAT_LIMIT:3}

# =========================================================
# Jackson
# =========================================================
#spring.jackson.serialization.write-dates-as-timestamps=false

# =========================================================
# Actuator / Observability
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

management.metrics.tags.application=${spring.application.name}

# =========================================================
# Logging
# =========================================================
logging.level.root=INFO
logging.level.com.yourpackage=INFO

# Keep SQL logging OFF during burst testing
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false